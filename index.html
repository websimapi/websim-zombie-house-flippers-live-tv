<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie House Flippers - Live TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .tv-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tv-screen {
            position: relative;
            width: 95vw;
            height: 90vh;
            background: #000;
            border: 15px solid #333;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 0 30px rgba(0,0,0,0.8),
                inset 0 0 20px rgba(255,255,255,0.1);
        }

        .tv-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,255,0,0.03) 2px,
                rgba(0,255,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .screen-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .show-header {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            border-bottom: 5px solid #333;
            position: relative;
            z-index: 10;
        }

        .episode-info {
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 10px 20px;
            font-size: 1.2em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            position: relative;
            z-index: 10;
        }

        .live-indicator {
            background: #ff0000;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .main-display {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .loading-slide {
            background: #111;
            color: #00ff00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }

        .loading-spinner {
            border: 4px solid #333;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .script-display {
            background: rgba(0,0,0,0.9);
            color: #00ff00;
            padding: 15px;
            font-size: 1.1em;
            height: 120px;
            overflow-y: auto;
            border-top: 2px solid #333;
            position: relative;
            z-index: 10;
        }

        .script-display::-webkit-scrollbar {
            width: 8px;
        }

        .script-display::-webkit-scrollbar-track {
            background: #111;
        }

        .script-display::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #00ff00;
            color: #000;
        }

        .status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9em;
            z-index: 100;
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            color: white;
            font-size: 1.5em;
        }

        #start-btn {
            background: #cc0000;
            color: white;
            border: 3px solid white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 1.5em;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 15px #ff0000;
            transition: all 0.3s ease;
        }

        #start-btn:hover {
            background: #ff0000;
            transform: scale(1.05);
            box-shadow: 0 0 25px #ff0000, 0 0 40px #ff0000;
        }
    </style>
</head>
<body>
    <div class="tv-container">
        <div class="tv-screen">
            <div id="start-overlay">
                <div>Click to power on the TV</div>
                <button id="start-btn">POWER ON</button>
            </div>
            <div class="screen-content">
                <div class="show-header">
                    🧟‍♂️ ZOMBIE HOUSE FLIPPERS 🏠
                </div>
                
                <div class="episode-info">
                    <span id="episode-title">Episode 1: "The Haunted Victorian"</span>
                    <span class="live-indicator">● LIVE</span>
                </div>

                <div class="main-display">
                    <div class="slide active loading-slide">
                        <div class="loading-spinner"></div>
                        <div>Generating first frame...</div>
                    </div>
                </div>

                <div class="script-display" id="script-display">
                    <div><strong>NARRATOR:</strong> Welcome to Zombie House Flippers! Today our undead heroes tackle a creepy Victorian mansion that's been abandoned for decades.</div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div>Status: <span id="status">Initializing...</span></div>
            <div>Scene: <span id="scene-counter">1</span></div>
        </div>

        <div class="controls">
            <button class="control-btn" id="pause-btn" onclick="togglePause()">⏸️ Pause</button>
            <button class="control-btn" onclick="skipScene()">⏭️ Skip</button>
            <button class="control-btn" onclick="restartEpisode()">🔄 Restart</button>
        </div>
    </div>

    <script>
        class ZombieHouseFlippersShow {
            constructor() {
                this.currentScene = 0;
                this.isPaused = false;
                this.slides = [];
                this.scriptLines = [];
                this.currentEpisode = 1;
                this.sceneImages = [];
                this.conversationHistory = [];
                this.currentAudio = null;
                this.nextFrameTimeout = null;
                this.voices = {
                    "NARRATOR": "pNInz6obpgDQGcFmaJgB", // Adam: Clear, deep voice for narration
                    "ZOMBIE JERRY": "N2lVSenRf2wimOdLGGwO", // James: A standard male voice
                    "ZOMBIE SANDRA": "en-female", // A standard female voice
                    "ZOMBIE MIKE": "yoZ06aMzmTo_p7_vVIJ1", // Sam: another distinct male voice
                    "GHOST RESIDENT": "oWAxZDx7w5z9imAjNAnP" // George: A deeper voice for the ghost
                };
                
                this.initializeScript();
                // this.startShow(); // Will be started by user interaction
            }

            initializeScript() {
                this.scriptLines = [
                    {
                        speaker: "NARRATOR",
                        text: "Welcome to Zombie House Flippers! Today our undead heroes tackle a creepy Victorian mansion that's been abandoned for decades.",
                        scene: "exterior_victorian_house"
                    },
                    {
                        speaker: "ZOMBIE JERRY",
                        text: "GRAAAHHH... *adjusts hard hat* This place needs serious work. The foundation is more rotten than my left arm!",
                        scene: "zombie_jerry_examining_foundation"
                    },
                    {
                        speaker: "ZOMBIE SANDRA",
                        text: "Don't worry Jerry, we've flipped worse. Remember that haunted castle last month? *chainsaw revs*",
                        scene: "zombie_sandra_with_chainsaw"
                    },
                    {
                        speaker: "ZOMBIE MIKE",
                        text: "First things first - we need to clear out these cobwebs. Good thing spiders don't bother the undead! *laughs zombily*",
                        scene: "zombie_mike_clearing_cobwebs"
                    },
                    {
                        speaker: "NARRATOR",
                        text: "Our zombie crew gets to work, but little do they know this house has some very much alive surprises waiting for them...",
                        scene: "zombies_working_on_house"
                    },
                    {
                        speaker: "ZOMBIE JERRY",
                        text: "Wait... did that door just close by itself? *tilts decomposing head* That's weird, even for us.",
                        scene: "mysterious_door_closing"
                    },
                    {
                        speaker: "ZOMBIE SANDRA",
                        text: "Probably just the wind, Jerry. Now help me with these rotten floorboards. They're almost as old as we are!",
                        scene: "replacing_floorboards"
                    },
                    {
                        speaker: "GHOST RESIDENT",
                        text: "WHO DARES DISTURB MY ETERNAL REST?! *spooky voice echoes*",
                        scene: "angry_ghost_appearing"
                    },
                    {
                        speaker: "ZOMBIE MIKE",
                        text: "Oh great, a ghost. Just what we needed. Listen buddy, we're trying to increase your property value here!",
                        scene: "zombie_mike_talking_to_ghost"
                    },
                    {
                        speaker: "NARRATOR",
                        text: "Will our zombie heroes be able to flip this haunted house? Find out after these messages!",
                        scene: "cliffhanger_scene"
                    }
                ];
            }

            async startShow() {
                this.updateStatus("Starting show...");
                this.generateNextFrame();
            }

            async generateNextFrame() {
                if (this.isPaused) return;

                if (this.currentScene >= this.scriptLines.length) {
                    this.currentScene = 0; // Loop back to start
                    this.currentEpisode++;
                    document.getElementById('episode-title').textContent = `Episode ${this.currentEpisode}: "A New Beginning"`;
                }

                const currentScript = this.scriptLines[this.currentScene];
                this.updateStatus("Generating frame & audio...");
                this.updateScriptDisplay(currentScript);

                try {
                    const imagePrompt = await this.createImagePrompt(currentScript);
                    
                    const imagePromise = websim.imageGen({
                        prompt: imagePrompt,
                        aspect_ratio: "16:9"
                    });
                    const ttsPromise = this.generateTTS(currentScript);

                    const [imageResult, ttsResult] = await Promise.all([imagePromise, ttsPromise]);

                    if (!imageResult || !ttsResult) {
                        throw new Error("Failed to generate media.");
                    }

                    this.sceneImages[this.currentScene] = imageResult.url;
                    await this.createSlide(imageResult.url);
                    
                    this.updateStatus("Playing scene...");
                    const audio = new Audio(ttsResult.url);
                    this.currentAudio = audio;
                    audio.play();
                    
                    audio.onended = () => {
                        this.currentAudio = null;
                        if (!this.isPaused) {
                            this.updateStatus("Waiting for next scene...");
                            this.scheduleNextFrame(1000); // 1 second pause between scenes
                        }
                    };
                    
                    // Analyze the scene in the background
                    this.analyzeSceneProgression(imageResult.url, currentScript);

                    this.currentScene++;
                    document.getElementById('scene-counter').textContent = this.currentScene;

                } catch (error) {
                    console.error('Error generating frame:', error);
                    this.updateStatus("Error generating frame, retrying...");
                    this.scheduleNextFrame(5000);
                }
            }

            async generateTTS(scriptLine) {
                const voice = this.voices[scriptLine.speaker] || 'en-male'; // Fallback voice
                try {
                    const result = await websim.textToSpeech({
                        text: scriptLine.text,
                        voice: voice
                    });
                    return result;
                } catch (error) {
                    console.error('Error generating TTS:', error);
                    this.updateStatus("Error generating audio...");
                    return null; // Allows the show to continue without audio for this line
                }
            }

            async createImagePrompt(scriptLine) {
                const basePrompt = `Zombie House Flippers TV show scene: ${scriptLine.scene}. A comedic horror TV show style, professional contractors who happen to be undead zombies, with visible but not grotesque decay (e.g., green-tinged skin, stitches). High-quality, vibrant, cinematic lighting.`;
                
                let contextualPrompt = basePrompt;
                
                switch(scriptLine.scene) {
                    case "exterior_victorian_house":
                        contextualPrompt += " A comedic TV show scene. Three professional zombie contractors, with endearing signs of decay like stitched limbs and dull green skin, stand proudly in front of a creepy Victorian mansion they are about to flip. They wear hard hats and tool belts. The house is dilapidated. The style is bright and funny, not scary.";
                        break;
                    case "zombie_jerry_examining_foundation":
                        contextualPrompt += " Close-up on Zombie Jerry, a dedicated zombie worker. He's crouched down, examining the cracked foundation of a house. He has greenish skin, a thoughtful but vacant stare, and is wearing professional work clothes and a hard hat. A comedic TV show scene.";
                        break;
                    case "zombie_sandra_with_chainsaw":
                        contextualPrompt += " Zombie Sandra, a competent female zombie worker, poses confidently with a chainsaw inside a dilapidated house. She has her hair in a messy bun, some tasteful stitches on her cheek, and wears practical construction gear. She looks determined. Comedic and bright TV show lighting.";
                        break;
                    case "zombie_mike_clearing_cobwebs":
                        contextualPrompt += " Zombie Mike, another zombie worker, cheerfully clears away massive, thick cobwebs from a ceiling with a broom. He's a zombie wearing a tool belt, focused on his task despite his undead appearance. Old Victorian interior, comedy TV show style.";
                        break;
                    case "zombies_working_on_house":
                        contextualPrompt += " The three zombie worker friends (Jerry, Sandra, Mike) collaborate on renovating the house. One is hammering, one is sawing, one is measuring. They are clumsy but effective zombie contractors. Comedic TV show scene.";
                        break;
                    case "mysterious_door_closing":
                        contextualPrompt += " An old wooden door slams shut on its own. In the background, a zombie worker with a confused expression, head tilted, pauses his work to look at it. Spooky but funny, bright TV show lighting.";
                        break;
                    case "replacing_floorboards":
                        contextualPrompt += " Two zombie workers are prying up old, rotten floorboards. They are focused and professional, despite being decaying zombies. Tools are scattered around them in an old Victorian house interior.";
                        break;
                    case "angry_ghost_appearing":
                        contextualPrompt += " A translucent, classic-looking angry ghost materializes in the house, looking furious. The zombie workers look up from their work, more surprised and annoyed than scared. A meeting of the undead. Comedy horror TV show style.";
                        break;
                    case "zombie_mike_talking_to_ghost":
                        contextualPrompt += " Zombie Mike, a zombie contractor in a hard hat, has a casual, slightly annoyed conversation with the angry floating ghost. He gestures as if explaining a work-related problem. The ghost looks indignant. A hilarious undead confrontation.";
                        break;
                    case "cliffhanger_scene":
                        contextualPrompt += " Dramatic wide shot of the haunted Victorian house. The zombie contractors and the ghost are visible through the windows, in a comical standoff. A suspenseful but funny final shot for the episode.";
                        break;
                    default:
                        contextualPrompt += " A general scene from the show, featuring zombie contractors at work.";
                }

                return contextualPrompt;
            }

            async analyzeSceneProgression(imageUrl, currentScript) {
                try {
                    const completion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "system",
                                content: "You are analyzing frames from the TV show 'Zombie House Flippers'. Based on the current image and script, determine how well the story is progressing and suggest any adjustments for the next scene."
                            },
                            {
                                role: "user",
                                content: [
                                    {
                                        type: "text",
                                        text: `Current script line: "${currentScript.speaker}: ${currentScript.text}"\n\nAnalyze this frame and suggest how the story should progress. Respond with a brief analysis of what's happening in the scene.`
                                    },
                                    {
                                        type: "image_url",
                                        image_url: { url: imageUrl }
                                    }
                                ]
                            }
                        ]
                    });

                    console.log("Scene Analysis:", completion.content);
                    this.updateStatus("Scene analyzed successfully");
                    
                } catch (error) {
                    console.error("Error analyzing scene:", error);
                    this.updateStatus("Analysis failed, continuing...");
                }
            }

            async createSlide(imageUrl) {
                const mainDisplay = document.querySelector('.main-display');
                
                // Create new slide
                const newSlide = document.createElement('div');
                newSlide.className = 'slide';
                
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = `Scene ${this.currentScene + 1}`;
                
                newSlide.appendChild(img);
                mainDisplay.appendChild(newSlide);

                // Wait for image to load
                await new Promise((resolve) => {
                    img.onload = resolve;
                    img.onerror = resolve;
                });

                // Fade transition
                setTimeout(() => {
                    // Hide current active slide
                    const currentActive = document.querySelector('.slide.active');
                    if (currentActive) {
                        currentActive.classList.remove('active');
                    }
                    
                    // Show new slide
                    newSlide.classList.add('active');
                    
                    // Clean up old slides (keep only last 3)
                    const allSlides = document.querySelectorAll('.slide');
                    if (allSlides.length > 3) {
                        allSlides[0].remove();
                    }
                }, 100);
            }

            updateScriptDisplay(scriptLine) {
                const display = document.getElementById('script-display');
                display.innerHTML = `<div><strong>${scriptLine.speaker}:</strong> ${scriptLine.text}</div>`;
                display.scrollTop = display.scrollHeight;
            }

            updateStatus(status) {
                document.getElementById('status').textContent = status;
            }

            scheduleNextFrame(delay) {
                if (!this.isPaused) {
                    this.nextFrameTimeout = setTimeout(() => {
                        this.generateNextFrame();
                    }, delay);
                }
            }

            pause() {
                this.isPaused = true;
                this.updateStatus("Paused");
                if (this.currentAudio) {
                    this.currentAudio.pause();
                }
                clearTimeout(this.nextFrameTimeout);
            }

            resume() {
                this.isPaused = false;
                this.updateStatus("Resumed");
                if (this.currentAudio && this.currentAudio.paused) {
                    this.currentAudio.play();
                } else if (!this.currentAudio) {
                    // If we were paused between scenes, start the next one.
                    this.generateNextFrame();
                }
            }

            skipScene() {
                clearTimeout(this.nextFrameTimeout);
                if (this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio = null;
                }
                if (this.isPaused) {
                    this.currentScene++; // Advance scene counter even if paused
                    document.getElementById('scene-counter').textContent = this.currentScene;
                } else {
                    this.generateNextFrame();
                }
            }

            restart() {
                clearTimeout(this.nextFrameTimeout);
                if (this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio = null;
                }
                this.currentScene = 0;
                this.currentEpisode = 1;
                document.getElementById('episode-title').textContent = `Episode 1: "The Haunted Victorian"`;
                if (this.isPaused) {
                     this.updateScriptDisplay(this.scriptLines[0]);
                     document.getElementById('scene-counter').textContent = 1;
                } else {
                    this.generateNextFrame();
                }
            }
        }

        // Initialize the show
        let show;
        window.addEventListener('load', () => {
            show = new ZombieHouseFlippersShow();

            document.getElementById('start-btn').addEventListener('click', () => {
                document.getElementById('start-overlay').style.display = 'none';
                show.startShow();
            });
        });

        // Control functions
        function togglePause() {
            const pauseBtn = document.getElementById('pause-btn');
            if (show.isPaused) {
                show.resume();
                pauseBtn.textContent = '⏸️ Pause';
            } else {
                show.pause();
                pauseBtn.textContent = '▶️ Play';
            }
        }

        function skipScene() {
            show.skipScene();
        }

        function restartEpisode() {
            show.restart();
        }

        // Add some TV static effect on load
        window.addEventListener('load', () => {
            const tvScreen = document.querySelector('.tv-screen');
            tvScreen.style.animation = 'none';
            setTimeout(() => {
                tvScreen.style.animation = '';
            }, 1000);
        });
    </script>
